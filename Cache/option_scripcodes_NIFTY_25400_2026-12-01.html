<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>NIFTY option contracts</title>
  <style>
    :root {
      font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
      color: #172b4d;
      background: #edf2f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(20px, 5vw, 64px);
      background:
        radial-gradient(ellipse at 12% 0%, #dcecff 0, transparent 42%),
        #edf2f8;
    }
    main { max-width: 1120px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 10px;
      color: #5272a0;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #102444;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -.045em;
    }
    .subtitle { margin: 10px 0 28px; color: #64748b; font-size: 15px; }
    .panel {
      overflow: hidden;
      border: 1px solid #dfe7f1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 50px #17345a12, 0 2px 8px #17345a08;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background: #f6f8fc; }
    th {
      padding: 16px 20px;
      color: #6a7d98;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td {
      padding: 17px 20px;
      border-top: 1px solid #edf1f6;
      color: #344762;
      font-size: 14px;
      white-space: nowrap;
    }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: #f6faff; }
    td:nth-child(3) {
      color: #143c75;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      font-weight: 750;
    }
    .strike-ce { color: #14532d; font-weight: 750; }
    .strike-pe { color: #7f1d1d; font-weight: 750; }
    td:last-child { color: #087e8b; font-weight: 750; }
    @media (max-width: 640px) {
      body { padding: 26px 14px; }
      th, td { padding: 14px 15px; }
      .subtitle { margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Option contracts</p>
    <h1>NIFTY · 25400</h1>
    <p class="subtitle">Expiry 2026-12-01 &nbsp;·&nbsp; CE and PE contracts</p>
    <section class="panel" aria-label="Option contract details">
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Exch</th><th scope="col">ExchType</th><th scope="col">ScripCode</th><th scope="col">Strike Price</th><th scope="col">Expiry</th><th scope="col">ScripType</th></tr></thead>
          <tbody>
            <tr><td>N</td><td>D</td><td>47782</td><td class="strike-ce">25200</td><td>2026-12-01</td><td>CE</td></tr><tr><td>N</td><td>D</td><td>47799</td><td class="strike-ce">25300</td><td>2026-12-01</td><td>CE</td></tr><tr><td>N</td><td>D</td><td>47806</td><td class="strike-ce">25400</td><td>2026-12-01</td><td>CE</td></tr><tr><td>N</td><td>D</td><td>47807</td><td class="strike-pe">25400</td><td>2026-12-01</td><td>PE</td></tr><tr><td>N</td><td>D</td><td>47811</td><td class="strike-pe">25500</td><td>2026-12-01</td><td>PE</td></tr><tr><td>N</td><td>D</td><td>47820</td><td class="strike-pe">25600</td><td>2026-12-01</td><td>PE</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
