name: Sensibull option-chain screenshot

on:
  schedule:
    - cron: "45,55 3 * * 1-5"
    - cron: "5,15,25,35,45,55 4-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensibull-screenshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Option_chain/requirements.txt
      - name: Install screenshot dependencies
        run: |
          python -m pip install -r .\Option_chain\requirements.txt
          python -m playwright install chromium
        shell: pwsh
      - name: Capture option chain
        run: python .\Option_chain\sensibull_screenshot.py
        shell: pwsh
