name: Sensibull option-chain screenshot

on:
  schedule:
    - cron: "45,55 3 * * 1-5"
    - cron: "5,15,25,35,45,55 4-9 * * 1-5"
  workflow_dispatch:
    inputs:
      tradingsymbol:
        description: Trading symbol
        required: false
        default: NIFTY
        type: string
      expiry:
        description: Expiry date in YYYY-MM-DD format
        required: false
        default: "2026-11-17"
        type: string

permissions:
  contents: read

concurrency:
  group: sensibull-screenshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r .\requirements.txt
        shell: pwsh
      - name: Capture option chain
        run: python .\Option_chain\sensibull_screenshot.py --tradingsymbol "${{ inputs.tradingsymbol || 'NIFTY' }}" --expiry "${{ inputs.expiry || '2026-11-17' }}"
        shell: pwsh
