name: Sensibull option-chain screenshot

on:
  schedule:
    - cron: "45,55 3 * * 1-5"
    - cron: "5,15,25,35,45,55 4-9 * * 1-5"
  workflow_dispatch:
    inputs:
      tradingsymbol:
        description: Trading symbol
        required: false
        default: NIFTY
        type: string
      expiry:
        description: Expiry date in YYYY-MM-DD format
        required: false
        default: "2026-11-17"
        type: string

permissions:
  contents: read

concurrency:
  group: sensibull-screenshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r .\requirements.txt
        shell: pwsh
      - name: Capture option chain
        env:
          TRADING_SYMBOL: ${{ inputs.tradingsymbol || 'NIFTY' }}
          EXPIRY_DATE: ${{ inputs.expiry || '2026-11-17' }}
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "SensibullScreenshots"
          python .\Option_chain\sensibull_screenshot.py --tradingsymbol "$env:TRADING_SYMBOL" --expiry "$env:EXPIRY_DATE" --output-dir "$outputDir"
        shell: pwsh
      - name: Save screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensibull-screenshot-${{ github.run_id }}
          path: ${{ runner.temp }}\SensibullScreenshots\*.png
          if-no-files-found: error
          retention-days: 7
